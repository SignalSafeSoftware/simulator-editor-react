name: Editor example
on:
  pull_request:
    paths:
      - docs/examples/editor/**
      - .github/workflows/example.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/examples/editor/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
